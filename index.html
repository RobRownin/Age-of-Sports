<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Age of Sports</title>
<meta name="theme-color" content="#070604" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070604; --surface:#1A140E; --surface2:#150F0A; --border:#3C2E1E;
    --gold:#C9A227; --gold-light:#E3C878; --red:#A61C1C; --text:#EDE1C4; --muted:#9C8B6C;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }

  header{ display:flex; align-items:center; justify-content:center; gap:8px; padding:22px 0 10px; }
  .wordmark{ font-size:14px; letter-spacing:.18em; text-transform:uppercase; }
  .wordmark .accent{ font-family:'Cinzel',serif; color:var(--gold); font-weight:600; }
  .divider{ height:2px; margin:0 32px 6px; background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.7; }

  main{ flex:1; overflow-y:auto; padding-bottom:104px; -webkit-overflow-scrolling:touch; }
  .screen{ padding:20px; display:none; flex-direction:column; gap:12px; }
  .screen.active{ display:flex; }

  .label{ font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin:0; }
  h1.title{ font-family:'Cinzel','Times New Roman',serif; font-size:22px; margin:2px 0 0; color:var(--text); }

  .hero-card{ display:flex; gap:16px; align-items:center; background:linear-gradient(to bottom, var(--surface), var(--surface2));
    border:1px solid var(--border); border-radius:16px; padding:16px; cursor:pointer; text-align:left; width:100%; color:inherit; font:inherit; }
  .hero-card:active{ transform:scale(0.99); }
  .hero-info{ flex:1; min-width:0; }
  .hero-info .name{ font-family:'Cinzel','Times New Roman',serif; font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-bar{ height:6px; border-radius:3px; background:var(--bg); overflow:hidden; margin-top:6px; }
  .mini-bar > div{ height:100%; background:var(--gold); }
  .chevron{ color:var(--muted); font-size:18px; flex-shrink:0; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; }
  .activity-row{ display:flex; align-items:center; gap:12px; }
  .activity-icon{ width:40px; height:40px; border-radius:12px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .activity-name{ font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .activity-sub{ font-size:12px; color:var(--muted); }
  .activity-right{ margin-left:auto; text-align:right; flex-shrink:0; }
  .activity-km{ font-family:'JetBrains Mono', monospace; font-size:14px; }
  .activity-mins{ font-size:11px; color:var(--muted); }

  .btn-primary{ background:var(--gold); color:var(--bg); border:none; border-radius:16px; padding:13px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; }
  .hint{ text-align:center; font-size:10px; color:var(--muted); margin:2px 0 0; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat-value{ font-family:'JetBrains Mono', monospace; font-size:24px; margin-top:2px; }
  .stat-value span{ font-size:13px; color:var(--muted); }
  .chart-row{ display:flex; align-items:flex-end; gap:8px; height:130px; margin-top:8px; }
  .chart-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; }
  .chart-bar{ width:100%; max-width:26px; background:var(--gold); border-radius:6px 6px 0 0; min-height:2px; }
  .chart-day{ font-size:11px; color:var(--muted); }

  .char-card{ display:flex; flex-direction:column; align-items:center; padding:20px; gap:4px; }
  .name-row{ display:flex; align-items:center; gap:6px; margin-top:6px; background:none; border:none; cursor:pointer; color:inherit; font:inherit; }
  .name-row .name{ font-family:'Cinzel','Times New Roman',serif; font-weight:600; font-size:16px; }
  .name-edit{ display:none; align-items:center; gap:8px; margin-top:6px; }
  .name-edit input{ background:var(--bg); color:var(--text); border:1px solid var(--gold); border-radius:8px; padding:6px 10px; font-family:'Cinzel','Times New Roman',serif; font-size:14px; text-align:center; width:160px; outline:none; }
  .name-edit button{ width:28px; height:28px; border-radius:8px; background:var(--gold); border:none; color:var(--bg); font-weight:700; cursor:pointer; }

  .attr-card{ margin-top:2px; }
  .attr-row{ display:flex; justify-content:space-between; margin-bottom:6px; font-size:14px; }
  .attr-row span.val{ color:var(--gold); font-family:'JetBrains Mono', monospace; }
  .attr-track{ height:6px; border-radius:3px; background:var(--bg); overflow:hidden; }
  .attr-track > div{ height:100%; background:var(--red); }

  .duel-btn{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; width:100%; cursor:pointer; color:var(--text); font:inherit; }
  .duel-btn .left{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; }

  nav.bottomnav{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:2px;
    background:rgba(26,20,14,.95); border:1px solid var(--border); border-radius:999px; padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.55); backdrop-filter:blur(6px); }
  nav.bottomnav button{ display:flex; align-items:center; gap:6px; border:none; background:transparent; border-radius:999px;
    padding:9px 11px; color:var(--muted); cursor:pointer; font-size:15px; }
  nav.bottomnav button.active{ background:var(--gold); color:var(--bg); padding:9px 15px; font-weight:600; font-size:12px; }

  /* ---- Add-activity bottom sheet ---- */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.open{ display:flex; }
  .sheet{ width:100%; max-width:480px; background:var(--surface); border-top:1px solid var(--border); border-radius:20px 20px 0 0;
    padding:18px 20px 26px; display:flex; flex-direction:column; gap:14px; max-height:88vh; overflow-y:auto; }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; }
  .sheet-header h2{ font-family:'Cinzel','Times New Roman',serif; font-size:17px; margin:0; }
  .sheet-close{ background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; }

  .type-row{ display:flex; gap:8px; }
  .type-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px;
    background:var(--bg); border:1px solid var(--border); border-radius:12px; color:var(--muted); font-size:11px; cursor:pointer; font-family:inherit; }
  .type-btn.active{ border-color:var(--gold); color:var(--text); background:rgba(201,162,39,0.12); }
  .type-btn .ic{ font-size:18px; }

  .metric-row{ display:flex; gap:8px; }
  .metric-btn{ flex:1; padding:8px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--muted); font-size:12px; cursor:pointer; font-family:inherit; }
  .metric-btn.active{ border-color:var(--gold); color:var(--gold); font-weight:600; }

  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:5px; letter-spacing:.05em; text-transform:uppercase; }
  .field input, .field textarea{ width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:14px; font-family:inherit; outline:none; }
  .field input:focus, .field textarea:focus{ border-color:var(--gold); }
</style>
</head>
<body>
<div class="app">

  <header>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M4,20 C4,12 7,6 11,3" stroke="#C9A227" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M20,20 C20,12 17,6 13,3" stroke="#C9A227" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
    <h1 class="wordmark">Age of <span class="accent">Sports</span></h1>
  </header>
  <div class="divider"></div>

  <main>
    <!-- ACTIVITIES -->
    <section class="screen active" id="screen-activities">
      <button class="hero-card" onclick="showScreen('character')">
        <div id="heroAvatar"></div>
        <div class="hero-info">
          <p class="label" id="heroLevel">Level 1</p>
          <p class="name" id="heroName">Leonidas</p>
          <div class="mini-bar"><div id="heroBarFill" style="width:0%"></div></div>
          <p class="hint" style="text-align:left;margin-top:4px;" id="heroRemain"></p>
        </div>
        <span class="chevron">›</span>
      </button>

      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;">
        <p class="label">Diese Woche</p>
        <h1 class="title" style="font-size:17px;">Aktivitäten</h1>
      </div>

      <div id="activityList" style="display:flex;flex-direction:column;gap:8px;"></div>

      <button class="btn-primary" style="margin-top:6px;" onclick="openActivityModal()">+ Aktivität erfassen</button>
      <p class="hint">Garmin-Sync folgt in einer späteren Version</p>
    </section>

    <!-- STATS -->
    <section class="screen" id="screen-stats">
      <div>
        <p class="label">Übersicht</p>
        <h1 class="title">Statistik</h1>
      </div>

      <div class="stat-grid">
        <div class="card">
          <p class="label">Diese Woche</p>
          <p class="stat-value" id="statWeekKm">0 <span>km</span></p>
        </div>
        <div class="card">
          <p class="label">Aktivitäten</p>
          <p class="stat-value" id="statCount">0</p>
        </div>
      </div>

      <div class="card">
        <p class="label" style="margin-bottom:4px;">Kilometer pro Tag</p>
        <div class="chart-row" id="chartRow"></div>
      </div>
    </section>

    <!-- CHARACTER -->
    <section class="screen" id="screen-character">
      <div>
        <p class="label">Charakter</p>
        <h1 class="title">Dein Olympionike</h1>
      </div>

      <div class="card char-card">
        <div id="charAvatar"></div>

        <button class="name-row" id="nameDisplayRow" onclick="startEditName()">
          <span class="name" id="charName">Leonidas</span>
          <span style="color:var(--muted);font-size:13px;">✎</span>
        </button>
        <div class="name-edit" id="nameEditRow">
          <input id="nameInput" maxlength="20" />
          <button onclick="saveName()">✓</button>
        </div>

        <p class="label" style="margin-top:8px;" id="charLevel">Level 1</p>
        <p class="hint" id="charRemain" style="margin-bottom:6px;"></p>
        <div id="laurelBarWrap"></div>
      </div>

      <div class="card attr-card" id="attrCard"></div>

      <button class="duel-btn">
        <span class="left">⚔️ Wettkampf antreten</span>
        <span class="chevron">›</span>
      </button>
      <p class="hint">Wettkämpfe in der Arena folgen in einer späteren Version</p>
    </section>
  </main>

  <nav class="bottomnav" id="bottomnav">
    <button data-tab="activities" onclick="showScreen('activities')">🔥</button>
    <button data-tab="stats" onclick="showScreen('stats')">📊</button>
    <button data-tab="character" onclick="showScreen('character')">⚔️</button>
  </nav>

  <!-- ADD ACTIVITY SHEET -->
  <div class="overlay" id="activityOverlay" onclick="if(event.target===this) closeActivityModal()">
    <div class="sheet">
      <div class="sheet-header">
        <h2>Aktivität erfassen</h2>
        <button class="sheet-close" onclick="closeActivityModal()">✕</button>
      </div>

      <div class="field">
        <label>Art der Aktivität</label>
        <div class="type-row" id="typeRow">
          <button class="type-btn active" data-type="run" data-icon="🏃" data-metric="distance" onclick="selectType(this)"><span class="ic">🏃</span>Lauf</button>
          <button class="type-btn" data-type="ride" data-icon="🚴" data-metric="distance" onclick="selectType(this)"><span class="ic">🚴</span>Rad</button>
          <button class="type-btn" data-type="walk" data-icon="🚶" data-metric="distance" onclick="selectType(this)"><span class="ic">🚶</span>Spaziergang</button>
          <button class="type-btn" data-type="strength" data-icon="🏋️" data-metric="reps" onclick="selectType(this)"><span class="ic">🏋️</span>Kraft</button>
        </div>
      </div>

      <div class="field">
        <label>Erfassungsart</label>
        <div class="metric-row" id="metricRow">
          <button class="metric-btn active" data-metric="distance" onclick="selectMetric(this)">Distanz (km)</button>
          <button class="metric-btn" data-metric="reps" onclick="selectMetric(this)">Wiederholungen</button>
        </div>
      </div>

      <div class="field" id="distanceField">
        <label>Distanz (km)</label>
        <input type="number" id="inputDistance" inputmode="decimal" step="0.1" min="0" placeholder="z. B. 5.0" />
      </div>
      <div class="field" id="repsField" style="display:none;">
        <label>Wiederholungen</label>
        <input type="number" id="inputReps" inputmode="numeric" step="1" min="0" placeholder="z. B. 40" />
      </div>

      <div class="field">
        <label>Dauer (Minuten)</label>
        <input type="number" id="inputDuration" inputmode="numeric" step="1" min="0" placeholder="z. B. 30" />
      </div>

      <div class="field">
        <label>Beschreibung</label>
        <input type="text" id="inputDescription" maxlength="60" placeholder="z. B. Abendlauf am Fluss" />
      </div>

      <button class="btn-primary" onclick="submitActivity()">Speichern</button>
    </div>
  </div>
</div>

<script>
// ---------- Mock data ----------
const DEFAULT_ACTIVITIES = [
  { type: "run", icon: "🏃", label: "Morgenlauf Isar", km: 8.4, reps: null, mins: 47, date: "Mo, 18. Aug" },
  { type: "ride", icon: "🚴", label: "Radtour Ammersee", km: 34.2, reps: null, mins: 88, date: "Di, 19. Aug" },
  { type: "walk", icon: "🚶", label: "Spaziergang Park", km: 3.1, reps: null, mins: 38, date: "Mi, 20. Aug" },
  { type: "run", icon: "🏃", label: "Intervalle Stadion", km: 6.0, reps: null, mins: 32, date: "Do, 21. Aug" },
];
const TYPE_LABEL = { run: "Lauf", ride: "Radtour", walk: "Spaziergang", strength: "Kraft" };
const DEFAULT_WEEK = [
  { day: "Mo", km: 8.4 }, { day: "Di", km: 34.2 }, { day: "Mi", km: 3.1 }, { day: "Do", km: 6.0 },
  { day: "Fr", km: 0 }, { day: "Sa", km: 0 }, { day: "So", km: 0 },
];
// Kilometer, die VOR den oben gelisteten Aktivitäten schon gesammelt wurden (ergibt zusammen die 214,7 km von vorher)
const BASE_LIFETIME_KM = 214.7 - totalKm(DEFAULT_ACTIVITIES);

let ACTIVITIES = JSON.parse(localStorage.getItem('aos_activities') || 'null') || DEFAULT_ACTIVITIES;
let WEEK = JSON.parse(localStorage.getItem('aos_week') || 'null') || DEFAULT_WEEK;

function totalKm(list) { return list.reduce((s, a) => s + (a.km || 0), 0); }
function lifetimeKm() { return BASE_LIFETIME_KM + totalKm(ACTIVITIES); }

function persist() {
  localStorage.setItem('aos_activities', JSON.stringify(ACTIVITIES));
  localStorage.setItem('aos_week', JSON.stringify(WEEK));
}

// ---------- Helpers ----------
function levelFromKm(totalKm) {
  const level = Math.max(1, Math.floor(totalKm / 50) + 1);
  const intoLevel = totalKm % 50;
  const pct = Math.min(100, Math.round((intoLevel / 50) * 100));
  return { level, pct, remaining: (50 - intoLevel).toFixed(1) };
}

function todayLabel() {
  const days = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const months = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
  const d = new Date();
  return `${days[d.getDay()]}, ${d.getDate()}. ${months[d.getMonth()]}`;
}

function todayWeekIndex() {
  // WEEK array runs Mo..So -> map JS getDay() (0=So) to that order
  const jsDay = new Date().getDay(); // 0=So,1=Mo,...
  return jsDay === 0 ? 6 : jsDay - 1;
}

    <circle cx="93" cy="38" r="1.6" fill="#2A2018"/>
    <circle cx="107" cy="38" r="1.6" fill="#2A2018"/>
  </svg>`;
}

// ---------- Laurel XP bar ----------
function laurelBarSVG(pct) {
  const w = 220, fillW = (w * pct) / 100;
  return `
  <div style="display:flex;align-items:center;gap:6px;">
    <svg width="14" height="20"><path d="M12,10 C6,10 6,3 12,3 C12,7 8,7 8,10 C8,13 12,13 12,17 C6,17 6,10 12,10 Z" fill="#8FA84A"/></svg>
    <svg width="${w}" height="20" viewBox="0 0 ${w} 20">
      <rect x="0" y="7" width="${w}" height="6" rx="3" fill="#3C2E1E"/>
      <rect x="0" y="7" width="${fillW}" height="6" rx="3" fill="#C9A227"/>
      <polygon points="${fillW},3 ${fillW + 6},10 ${fillW},17" fill="#A61C1C" stroke="#0D0A07" stroke-width="1"/>
    </svg>
    <svg width="14" height="20"><path d="M2,10 C8,10 8,3 2,3 C2,7 6,7 6,10 C6,13 2,13 2,17 C8,17 8,10 2,10 Z" fill="#8FA84A"/></svg>
  </div>`;
}

// ---------- State ----------
let characterName = localStorage.getItem('aos_characterName') || 'Leonidas';

function totalKm(list) { return list.reduce((s, a) => s + a.km, 0); }

function renderActivities() {
  const list = document.getElementById('activityList');
  list.innerHTML = ACTIVITIES.slice().reverse().map(a => `
    <div class="card activity-row">
      <div class="activity-icon">${a.icon}</div>
      <div style="flex:1;min-width:0;">
        <div class="activity-name">${a.label}</div>
        <div class="activity-sub">${TYPE_LABEL[a.type] || a.type} · ${a.date}</div>
      </div>
      <div class="activity-right">
        <div class="activity-km">${a.km ? a.km.toFixed(1) + ' km' : (a.reps || 0) + ' Wdh.'}</div>
        <div class="activity-mins">⏱ ${a.mins} min</div>
      </div>
    </div>`).join('');
}

function renderStats() {
  const weekKm = totalKm(WEEK);
  document.getElementById('statWeekKm').innerHTML = weekKm.toFixed(1) + ' <span>km</span>';
  document.getElementById('statCount').textContent = ACTIVITIES.length;
  const max = Math.max(...WEEK.map(d => d.km), 1);
  document.getElementById('chartRow').innerHTML = WEEK.map(d => `
    <div class="chart-col">
      <div class="chart-bar" style="height:${Math.max(2, (d.km / max) * 100)}%"></div>
      <div class="chart-day">${d.day}</div>
    </div>`).join('');
}

function renderAttrs(level) {
  const attrs = [
    { name: 'Ausdauer', value: Math.min(99, 20 + level * 6) },
    { name: 'Tempo', value: Math.min(99, 15 + level * 5) },
    { name: 'Kraft', value: Math.min(99, 10 + level * 4) },
  ];
  document.getElementById('attrCard').innerHTML = attrs.map(a => `
    <div class="attr-row-wrap">
      <div class="attr-row"><span>${a.name}</span><span class="val">${a.value}</span></div>
      <div class="attr-track"><div style="width:${a.value}%"></div></div>
    </div>`).join('<div style="height:10px"></div>');
}

function renderCharacterAndHero() {
  const { level, pct, remaining } = levelFromKm(lifetimeKm());

  document.getElementById('heroAvatar').innerHTML = avatarSVG(64);
  document.getElementById('heroLevel').textContent = 'Level ' + level;
  document.getElementById('heroName').textContent = characterName;
  document.getElementById('heroBarFill').style.width = pct + '%';
  document.getElementById('heroRemain').textContent = `noch ${remaining} km bis Level ${level + 1}`;

  document.getElementById('charAvatar').innerHTML = avatarSVG(140);
  document.getElementById('charName').textContent = characterName;
  document.getElementById('charLevel').textContent = 'Level ' + level;
  document.getElementById('charRemain').textContent = `noch ${remaining} km bis Level ${level + 1}`;
  document.getElementById('laurelBarWrap').innerHTML = laurelBarSVG(pct);

  renderAttrs(level);
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('#bottomnav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === name);
  });
}

function startEditName() {
  document.getElementById('nameDisplayRow').style.display = 'none';
  document.getElementById('nameEditRow').style.display = 'flex';
  const input = document.getElementById('nameInput');
  input.value = characterName;
  input.focus();
  input.onkeydown = (e) => { if (e.key === 'Enter') saveName(); };
}

function saveName() {
  const val = document.getElementById('nameInput').value.trim();
  characterName = val.length > 0 ? val.slice(0, 20) : characterName;
  localStorage.setItem('aos_characterName', characterName);
  document.getElementById('nameDisplayRow').style.display = 'flex';
  document.getElementById('nameEditRow').style.display = 'none';
  renderCharacterAndHero();
}

// ---------- Add-activity sheet ----------
let selectedType = "run";
let selectedMetric = "distance";

function openActivityModal() {
  document.getElementById('activityOverlay').classList.add('open');
}
function closeActivityModal() {
  document.getElementById('activityOverlay').classList.remove('open');
}

function selectType(btn) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedType = btn.dataset.type;
  // sinnvolle Standard-Erfassungsart je Aktivitätstyp vorschlagen, bleibt aber änderbar
  const suggestedMetric = btn.dataset.metric;
  const metricBtn = document.querySelector(`.metric-btn[data-metric="${suggestedMetric}"]`);
  if (metricBtn) selectMetric(metricBtn);
}

function selectMetric(btn) {
  document.querySelectorAll('.metric-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedMetric = btn.dataset.metric;
  document.getElementById('distanceField').style.display = selectedMetric === 'distance' ? 'block' : 'none';
  document.getElementById('repsField').style.display = selectedMetric === 'reps' ? 'block' : 'none';
}

function submitActivity() {
  const duration = parseInt(document.getElementById('inputDuration').value, 10) || 0;
  const description = document.getElementById('inputDescription').value.trim();
  const distance = parseFloat(document.getElementById('inputDistance').value) || 0;
  const reps = parseInt(document.getElementById('inputReps').value, 10) || 0;

  if (duration <= 0) {
    alert('Bitte eine Dauer in Minuten angeben.');
    return;
  }
  if (selectedMetric === 'distance' && distance <= 0) {
    alert('Bitte eine Distanz größer 0 angeben.');
    return;
  }
  if (selectedMetric === 'reps' && reps <= 0) {
    alert('Bitte eine Anzahl an Wiederholungen größer 0 angeben.');
    return;
  }

  const iconMap = { run: "🏃", ride: "🚴", walk: "🚶", strength: "🏋️" };
  const km = selectedMetric === 'distance' ? distance : 0;

  const activity = {
    type: selectedType,
    icon: iconMap[selectedType] || "🏅",
    label: description.length > 0 ? description : `${TYPE_LABEL[selectedType]}-Aktivität`,
    km: km,
    reps: selectedMetric === 'reps' ? reps : null,
    mins: duration,
    date: todayLabel(),
  };

  ACTIVITIES.push(activity);
  if (km > 0) {
    WEEK[todayWeekIndex()].km += km;
  }
  persist();

  renderActivities();
  renderStats();
  renderCharacterAndHero();

  // Formular zurücksetzen
  document.getElementById('inputDistance').value = '';
  document.getElementById('inputReps').value = '';
  document.getElementById('inputDuration').value = '';
  document.getElementById('inputDescription').value = '';
  closeActivityModal();
}

// ---------- Init ----------
renderActivities();
renderStats();
renderCharacterAndHero();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
</script>
</body>
</html>
